name: Configure SJC23 POC Guardrails

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact confirmation required to bind the SJC23 POC policy
        required: true
        type: string

permissions:
  contents: read

jobs:
  configure:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.confirmation == 'CONFIGURE_SJC23_POC_GUARDRAILS'
    runs-on: [self-hosted, sda-relay]
    steps:
      - uses: actions/checkout@v4
      - name: Bind reviewed POC allocation policy
        run: bash admin/configure_sjc23_poc_guardrails.sh "$GITHUB_WORKSPACE"
